name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[test,twin]
      - run: pytest -q
  oldest-dependencies:
    # the lowest versions pyproject.toml allows, core and [twin] extra
    # (scipy 1.11.0 is yanked on PyPI but installs with an exact pin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install "numpy==1.26.0" "scipy==1.11.0" "tmm==0.1.8" "pytest>=7" "jax==0.4.30" "jaxlib==0.4.30" "optax==0.2.0" "chex==0.1.90" "ml-dtypes==0.5.4"
      - run: pip install --no-deps -e .
      - run: pytest -q
