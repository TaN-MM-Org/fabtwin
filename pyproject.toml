[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fabtwin"
version = "0.10.1"
description = "Learned generative process twins for yield-aware inverse design of multilayer optics: exact TMM with a hand-derived adjoint, CVaR robustification through twin and physics at once"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Tanvir Mahmud Mahim"}]
dependencies = ["numpy>=1.26", "scipy>=1.11"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/TaN-MM-Org/fabtwin"
Paper = "https://doi.org/10.1109/JSEN.2026.3732239"
"Paper code" = "https://github.com/Tanvir-Mahmud-Mahim/Learned-generative-process-twins-for-yield-aware-inverse-design-of-multilayer-photonic-sensor"

[project.optional-dependencies]
twin = ["jax>=0.4.30", "optax>=0.2"]
test = ["pytest>=7", "tmm>=0.1.8"]

[tool.setuptools.packages.find]
where = ["src"]
